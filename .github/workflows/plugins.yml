name: Declarative plugin distribution

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing registry release tag, for example official-nestjs-v1.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: ProvisionLabs/provisionhub
          ref: 0bf820e0c2a2115041a349234f63cbac9b4526e6
          path: .core
      - uses: actions/setup-go@v7
        with:
          go-version-file: .core/go.mod
          cache-dependency-path: .core/go.sum
      - name: Validate manifests, declared inputs and package security
        working-directory: .core
        run: go test ./internal/plugins ./internal/registry
      - name: Build deterministic packages and validate registry
        run: |
          cd .core
          go run ./cmd/pluginpack ../plugins ../dist ../registry.json
          go run ./cmd/pluginpack ../plugins ../dist-repeat ../registry.json
          cd ..
          diff -r dist dist-repeat
          node scripts/check-registry.mjs
      - name: Validate configured CLI generation without npm or network
        run: |
          cd .core
          go build -o provisionhub-test.exe ./cmd/provisionhub
          cd ..
          PROVISIONHUB_BIN="$GITHUB_WORKSPACE/.core/provisionhub-test.exe" node --test tests/configuration.test.mjs tests/connections.test.mjs
      - name: Install official packages, restart offline and generate named components
        working-directory: .core
        env:
          PROVISIONHUB_OFFICIAL_PLUGINS: ${{ github.workspace }}/plugins
        run: go test -count=1 -run TestOfficialPackageLifecycle ./internal/application
      - uses: actions/upload-artifact@v4
        with:
          name: official-plugin-packages-${{ matrix.os }}
          path: dist/
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: official-plugin-packages-ubuntu-latest
          path: dist
      - name: Publish a new release without replacing an existing tag or artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-registry.mjs "$RELEASE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo 'Refusing to replace an existing tag'; exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release'; exit 1
          fi
          gh release create "$RELEASE_TAG" "dist/$RELEASE_TAG.tar.gz" "dist/$RELEASE_TAG.tar.gz.sha256" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'Declarative generator package. Verify SHA-256 against registry.json before installation.'
