apiVersion: provisionhub.dev/plugin/v1alpha1
id: official-nextjs
version: 1.3.0
technologyId: nextjs
category: frontend
name: Next.js
description: Minimal Next.js App Router frontend with TypeScript and Tailwind CSS
capability: generate_frontend
configuration:
  properties:
    welcomeMessage:
      type: string
      label: Welcome message
      description: Introductory text on the starter home page.
      default: Welcome to your new Next.js application.
      minLength: 1
      maxLength: 240
    showCredits:
      type: boolean
      label: Show technology credits
      description: Display the technology credit footer on the home page.
      default: true
connections:
  consumes:
    - id: server-api
      type: http
      description: Configure a server-side API origin for this frontend.
      requires:
        properties:
          port:
            type: integer
            required: true
            minimum: 1
            maximum: 65535
          protocol:
            type: enum
            options: [http]
            required: true
      configuration:
        properties:
          serverHost:
            type: string
            format: host
            label: Backend host reachable from the Next.js server
            description: DNS hostname or IP only. No scheme, port, credentials, or path. Loopback works only on the same host.
            required: true
            maxLength: 253
      files:
        - type: template
          source: templates/connections/http.env.tmpl
          destination: frontend/.env.local
        - type: template
          source: templates/connections/http.env.tmpl
          destination: frontend/.env.example
files:
  - type: template
    source: templates/package.json.tmpl
    destination: frontend/package.json
  - type: copy
    source: templates/tsconfig.json
    destination: frontend/tsconfig.json
  - type: copy
    source: templates/next.config.ts
    destination: frontend/next.config.ts
  - type: copy
    source: templates/postcss.config.mjs
    destination: frontend/postcss.config.mjs
  - type: copy
    source: templates/eslint.config.mjs
    destination: frontend/eslint.config.mjs
  - type: copy
    source: templates/gitignore
    destination: frontend/.gitignore
  - type: template
    source: templates/README.md.tmpl
    destination: frontend/README.md
  - type: template
    source: templates/src/app/layout.tsx.tmpl
    destination: frontend/src/app/layout.tsx
  - type: template
    source: templates/src/app/page.tsx.tmpl
    destination: frontend/src/app/page.tsx
  - type: copy
    source: templates/src/app/globals.css
    destination: frontend/src/app/globals.css
